<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arXivEndorserFinder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Academic-connection-based</p>
          <h1 class="brand-title">
            <img class="arxiv-logo" src="/arxiv-logo.svg" alt="arXiv" />
            <span>Endorser Finder</span>
          </h1>
        </div>
        <a class="how-to-link" href="https://github.com/jiazhou-cheng/arXiv-endorser-finder" target="_blank" rel="noreferrer">
          How to use
        </a>
      </header>

      <section class="search-panel" aria-labelledby="search-title">
        <div class="section-head">
          <h2 id="search-title">Find potential endorsers</h2>
          <p>Searches arXiv API metadata by category and connection.</p>
        </div>

        <form id="search-form" class="form-grid">
          <label>
            <span>Target category</span>
            <input
              id="target-category"
              name="targetCategory"
              list="category-list"
              placeholder="cs.AI"
              autocomplete="off"
              required
            />
            <datalist id="category-list"></datalist>
          </label>

          <label>
            <span>Paper budget</span>
            <select id="max-results" name="maxResults">
              <option value="100" selected>100 papers</option>
              <option value="500">500 papers</option>
              <option value="1000">1000 papers</option>
              <option value="5000">5000 papers</option>
            </select>
          </label>

          <label>
            <span>PI / Senior collaborator <small>optional</small></span>
            <input id="connection" name="connection" placeholder="Full name (e.g. Firstname M. Lastname)" />
          </label>

          <button type="submit" id="submit-button">Find candidates</button>
        </form>
      </section>

      <section id="rate-limit-status" class="rate-limit-status" aria-live="polite">
        <div class="rate-limit-info">
          <label class="toggle-switch">
            <input type="checkbox" id="rate-limit-toggle">
            <span class="toggle-slider"></span>
          </label>
          <span class="rate-limit-text">Rate limiting</span>
        </div>
      </section>

      <section id="progress" class="progress hidden" aria-live="polite">
        <div class="spinner"></div>
        <p>Searching recent arXiv metadata and ranking candidates from PI networks, author roles, and category activity.</p>
      </section>

      <section id="summary" class="summary hidden"></section>
      <section id="results" class="results" aria-live="polite"></section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
